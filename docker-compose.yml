services:
  web:
    build: .
    container_name: nascon-backend
    ports:
      - "8080:8080"
    environment:
      - DAY1_SALT=${DAY1_SALT}
      - DAY2_SALT=${DAY2_SALT}
      - PORT=8080
    networks:
      default:
        aliases:
          - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\").getcode() == 200 else 1)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  media:
    image: bluenviron/mediamtx:1.9.0
    container_name: nascon-media-server
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    restart: unless-stopped

  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    restart: unless-stopped

  node-chrome-1:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    restart: unless-stopped

  node-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    restart: unless-stopped

  node-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "1gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    restart: unless-stopped
