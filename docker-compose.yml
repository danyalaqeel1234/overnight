services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DAY1_SALT=${DAY1_SALT}
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; import sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8080/health\").getcode() == 200 else 1)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: unless-stopped
